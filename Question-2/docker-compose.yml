services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: erp_interview
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_local_password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d erp_interview"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - erp_postgres_data:/var/lib/postgresql/data

volumes:
  erp_postgres_data:
